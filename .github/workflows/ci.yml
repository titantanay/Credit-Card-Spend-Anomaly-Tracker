name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run analytics pipeline
        env:
          DUCKDB_PATH: ${{ github.workspace }}/database/spend_monitor.duckdb
        run: |
          make generate-data
          make ingest
          make dbt-run
          make detect-anomalies
          make narrate-anomalies

      - name: pytest
        env:
          DUCKDB_PATH: ${{ github.workspace }}/database/spend_monitor.duckdb
        run: .venv/bin/pytest -q

      - name: dbt test
        env:
          DUCKDB_PATH: ${{ github.workspace }}/database/spend_monitor.duckdb
        run: make dbt-test

      - name: Acceptance verify
        env:
          DUCKDB_PATH: ${{ github.workspace }}/database/spend_monitor.duckdb
        run: make verify
